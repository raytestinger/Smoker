# Smoker structured logging configuration.
#
# Run_Smoker.pl replaces:
#   __LOG_LEVEL__ with SMOKER_LOG_LEVEL (default INFO)
#   __TRACE_LOG__ with the current batch's logs/trace.log path

log4perl.logger.Smoker = __LOG_LEVEL__, TraceFile
log4perl.additivity.Smoker = 0

log4perl.appender.TraceFile = Log::Log4perl::Appender::File
log4perl.appender.TraceFile.filename = __TRACE_LOG__
log4perl.appender.TraceFile.mode = append

log4perl.appender.TraceFile.layout = Log::Log4perl::Layout::PatternLayout
log4perl.appender.TraceFile.layout.ConversionPattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%p] %c pid=%P - %m%n
